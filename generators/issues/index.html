<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>WILVO Engineering Hub</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            // WILVO: de Hub als app op de telefoon. Alleen op de Hub zelf (niet in de generatoren): manifest en
            // service worker; de installatiemelding van de browser bewaren we voor de knop Installeren in de Hub.
            if (!/\/generators\//.test(location.pathname)) {
                document.head.insertAdjacentHTML("beforeend", '<link rel="manifest" href="assets/manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="WILVO Hub"><meta name="theme-color" content="#ffffff">');
                if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
            }
            addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__wilvoInstall = e; });
        </script>

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #6f96a6;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #6f96a6;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #f5f3f1;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>

            toggleIcon.addEventListener("click", function () {
                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // WILVO: als gast inloggen = naam "Gast" plus het gastwachtwoord
            document.getElementById("wilvo-gast").addEventListener("change", function () {
                const gast = this.checked, pw = document.getElementById("staticrypt-password");
                document.getElementById("wilvo-naam-box").classList.toggle("hidden", gast);
                pw.placeholder = gast ? "Gastwachtwoord" : "Persoonlijke code";
                (gast ? pw : document.getElementById("wilvo-naam")).focus();
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                // WILVO: persoonlijke code. Gevonden: de code ontsleutelt de Hub-sleutel plus naam en rol.
                // Niet gevonden: probeer hem als het oude gedeelde wachtwoord (werkt tot 'sleutel-vervangen').
                const salt = staticryptConfig.staticryptSaltUniqueVariableName,
                    { cryptoEngine, decode } = staticryptInitiator,
                    hashed = await cryptoEngine.hashPassword(password.trim(), salt),
                    entry = WILVO_USERS[await cryptoEngine.signMessage(hashed, "wilvo-gebruiker")];
                let key = hashed, user = null;
                if (entry) {
                    const r = await decode(entry, hashed, salt);
                    if (r.success) { const u = JSON.parse(r.decoded); key = u.k; user = { naam: u.naam, rol: u.rol }; }
                    // de code hoort bij één persoon: de ingevulde naam moet kloppen (hoofdletters en spaties maken niet uit)
                    const norm = s => s.trim().replace(/\s+/g, " ").toLowerCase();
                    const naam = document.getElementById("wilvo-gast").checked ? "Gast" : document.getElementById("wilvo-naam").value;
                    if (!user || norm(naam) !== norm(user.naam)) { alert(templateError); return; }
                }
                try {
                    // gast: de naam bij voorstellen e.d. blijft vrij in te vullen
                    if (user) { localStorage.setItem("wilvo.hub.user", JSON.stringify(user)); if (user.rol !== "gast") localStorage.setItem("wilvo.hub.suggestName", user.naam); else localStorage.removeItem("wilvo.hub.suggestName"); }
                    else localStorage.removeItem("wilvo.hub.user");
                    // hash van de code: Instellingen > Accounts opent daarmee zonder de code opnieuw te vragen.
                    // Zelfde bewaarplek en duur als de Hub-sleutel (30 dagen onthouden of alleen dit tabblad).
                    localStorage.removeItem("wilvo.hub.codehash"); sessionStorage.removeItem("wilvo.hub.codehash");
                    if (user) (isRememberChecked ? localStorage : sessionStorage).setItem("wilvo.hub.codehash", hashed);
                } catch (_) { /* geen opslag: dan zonder naam */ }

                const { isSuccessful } = await staticrypt.handleDecryptionOfPageFromHash(key, isRememberChecked);

                if (!isSuccessful) {
                    try { ["wilvo.hub.user", "wilvo.hub.codehash"].forEach(k => { localStorage.removeItem(k); sessionStorage.removeItem(k); }); } catch (_) {}
                    alert(templateError);
                }
            });
