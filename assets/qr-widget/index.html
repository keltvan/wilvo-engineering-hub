<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WILVO | QR</title>
<!-- Het WILVO-logo (../wilvo-logo.svg) als staand plaatwerk van blokjes; tik: het logo valt naar voren en dezelfde blokjes
     vormen de QR-code. Eigen QR-encoder (bytemodus, correctieniveau M, versie 1-10), alleen three.js uit ../../vendor.
     ?u=<adres> verandert de QR (standaard de Engineering Hub). -->
<style>
:root { --warm: #f5f3f1; --red-ink: #c41f27; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--warm); overflow: hidden; }
#stage { position: absolute; inset: 0; cursor: pointer; outline-offset: -3px; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stage:focus-visible { outline: 3px solid var(--red-ink); }
#flat { display: none; margin: auto; max-width: 90%; max-height: 90%; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="stage" role="button" tabindex="0" aria-pressed="false" aria-label="WILVO-logo: wissel tussen het logo en de QR-code van de Engineering Hub"></div>
<script src="../../vendor/three-0.147.0/three.min.js"></script>
<script>
"use strict";
// ---------- QR-encoder (bytemodus, niveau M, versie 1-10) ----------
function makeQR(text) {
  const data = Array.from(new TextEncoder().encode(text));
  const ECC = [10, 16, 26, 18, 24, 16, 18, 22, 22, 26], BLK = [1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const raw = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const a = (v / 7 | 0) + 2; r -= (25 * a - 10) * a - 55; if (v >= 7) r -= 36; } return r; };
  let ver = 1;
  while (4 + (ver < 10 ? 8 : 16) + 8 * data.length > ((raw(ver) >> 3) - ECC[ver - 1] * BLK[ver - 1]) * 8) {
    if (++ver > 10) throw new Error("tekst te lang voor de QR (max. ± 213 tekens)");
  }
  const total = raw(ver) >> 3, eccLen = ECC[ver - 1], nb = BLK[ver - 1], cap = total - eccLen * nb;
  const bits = [], put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  put(4, 4); put(data.length, ver < 10 ? 8 : 16); data.forEach(b => put(b, 8));
  put(0, Math.min(4, cap * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  for (let p = 0xEC; bits.length < cap * 8; p ^= 0xEC ^ 0x11) put(p, 8);
  const bytes = []; for (let i = 0; i < bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8).join(""), 2));

  const exp = [], log = []; for (let i = 0, x = 1; i < 255; i++) { exp[i] = x; log[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
  const mul = (a, b) => a && b ? exp[log[a] + log[b]] : 0;
  let gen = [1];
  for (let i = 0; i < eccLen; i++) { const n = new Array(gen.length + 1).fill(0); gen.forEach((c, j) => { n[j] ^= c; n[j + 1] ^= mul(c, exp[i]); }); gen = n; }
  const rem = d => { const r = new Array(eccLen).fill(0); for (const b of d) { const f = b ^ r.shift(); r.push(0); for (let i = 0; i < eccLen; i++) r[i] ^= mul(gen[i + 1], f); } return r; };
  const short = nb - total % nb, shortLen = (total / nb | 0) - eccLen, blocks = [];
  for (let i = 0, k = 0; i < nb; i++) { const d = bytes.slice(k, k += shortLen + (i < short ? 0 : 1)); blocks.push({ d, e: rem(d) }); }
  const code = [];
  for (let i = 0; i <= shortLen; i++) blocks.forEach(b => { if (i < b.d.length) code.push(b.d[i]); });
  for (let i = 0; i < eccLen; i++) blocks.forEach(b => code.push(b.e[i]));

  const size = ver * 4 + 17, mod = [], fn = [];
  for (let y = 0; y < size; y++) { mod.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
  const set = (x, y, d) => { if (x >= 0 && y >= 0 && x < size && y < size) { mod[y][x] = d; fn[y][x] = true; } };
  for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]])
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)); set(cx + dx, cy + dy, d !== 2 && d !== 4); }
  if (ver > 1) {
    const n = (ver / 7 | 0) + 2, step = ((ver * 8 + n * 3 + 5) / (n * 4 - 4) | 0) * 2, pos = [6];
    for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
    pos.forEach((cy, i) => pos.forEach((cx, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
  }
  const drawFormat = mask => {
    let r = mask; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const f = ((mask << 10) | r) ^ 0x5412, b = i => ((f >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) set(8, i, b(i));
    set(8, 7, b(6)); set(8, 8, b(7)); set(7, 8, b(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, b(i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, b(i));
    for (let i = 8; i < 15; i++) set(8, size - 15 + i, b(i));
    set(8, size - 8, true);
  };
  drawFormat(0);
  if (ver >= 7) {
    let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
    const v = (ver << 12) | r;
    for (let i = 0; i < 18; i++) { const b = ((v >>> i) & 1) !== 0, a = size - 11 + i % 3, c = i / 3 | 0; set(a, c, b); set(c, a, b); }
  }
  let k = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
      const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - vert : vert;
      if (!fn[y][x] && k < code.length * 8) { mod[y][x] = ((code[k >> 3] >>> (7 - (k & 7))) & 1) !== 0; k++; }
    }
  }
  const cond = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
    (x, y) => ((x / 3 | 0) + (y / 2 | 0)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
    (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
  const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && cond[m](x, y)) mod[y][x] = !mod[y][x]; };
  const count = (s, p) => { let n = 0, i = -1; while ((i = s.indexOf(p, i + 1)) >= 0) n++; return n; };
  const penalty = () => {
    let p = 0, dark = 0;
    const lines = [];
    for (let y = 0; y < size; y++) { lines.push(mod[y].map(Number).join("")); }
    for (let x = 0; x < size; x++) { lines.push(mod.map(r => Number(r[x])).join("")); }
    for (const s of lines) {
      for (const m of s.match(/0{5,}|1{5,}/g) || []) p += 3 + m.length - 5;
      p += 40 * (count(s, "10111010000") + count(s, "00001011101"));
    }
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (mod[y][x]) dark++;
      if (x && y && mod[y][x] === mod[y][x - 1] && mod[y][x] === mod[y - 1][x] && mod[y][x] === mod[y - 1][x - 1]) p += 3;
    }
    return p + (Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1) * 10;
  };
  let best = 0, bestP = Infinity;
  for (let m = 0; m < 8; m++) { applyMask(m); drawFormat(m); const p = penalty(); if (p < bestP) { best = m; bestP = p; } applyMask(m); }
  applyMask(best); drawFormat(best);
  return { size, ver, mask: best, dark: (x, y) => mod[y][x] };
}

// ---------- Instellingen ----------
const params = new URLSearchParams(location.search);
const HUB = "https://keltvan.github.io/wilvo-engineering-hub/";
const target = (params.get("u") || HUB).slice(0, 200);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const qr = makeQR(target);

if (params.has("selftest")) {
  const s = qr.size, bad = [];
  if (s !== qr.ver * 4 + 17) bad.push("grootte");
  for (const [x, y] of [[3, 3], [s - 4, 3], [3, s - 4]]) if (!qr.dark(x, y) || qr.dark(x + 2, y) || !qr.dark(x + 3, y)) bad.push("zoekblokje");
  for (let i = 8; i < s - 8; i++) if (qr.dark(i, 6) !== (i % 2 === 0) || qr.dark(6, i) !== (i % 2 === 0)) bad.push("timing");
  const bit = (x, y) => qr.dark(x, y) ? 1 : 0;
  let f1 = 0, f2 = 0;
  for (let i = 0; i < 15; i++) {
    f1 |= bit(...(i < 6 ? [8, i] : i < 8 ? [8, i + 1] : i === 8 ? [7, 8] : [14 - i, 8])) << i;
    f2 |= bit(...(i < 8 ? [s - 1 - i, 8] : [8, s - 15 + i])) << i;
  }
  let r = f1 ^ 0x5412; for (let i = 14; i >= 10; i--) if ((r >>> i) & 1) r ^= 0x537 << (i - 10);
  if (f1 !== f2 || r !== 0) bad.push("formaatbits");
  document.documentElement.dataset.selftest = bad.length ? "fail " + bad.join(",") : "pass qr v" + qr.ver + " masker " + qr.mask;
}

// ---------- Scene ----------
const stage = document.getElementById("stage");
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { renderer = null; }
if (!renderer) { // zonder WebGL: platte QR, zodat de tegel nooit leeg blijft
  const c = document.createElement("canvas"), n = qr.size + 8, g = c.getContext("2d");
  c.width = c.height = n; c.id = "flat"; c.style.display = "block";
  g.fillStyle = "#fff"; g.fillRect(0, 0, n, n); g.fillStyle = "#252b2e";
  for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) if (qr.dark(x, y)) g.fillRect(x + 4, y + 4, 1, 1);
  stage.appendChild(c);
  throw new Error("WebGL niet beschikbaar: platte QR getoond");
}
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setClearColor(0xf5f3f1);
renderer.shadowMap.enabled = true; renderer.autoClear = false;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(-18, 40, 24);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 120 });
scene.add(sun);
const glint = new THREE.PointLight(0xfff4e0, 0, 24, 1.3); glint.position.set(-20, 9, 6); scene.add(glint);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);

const S = qr.size, N = S + 4, half = N / 2, rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const ss = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const rad = d => d * Math.PI / 180, lerp = (a, b, t) => a + (b - a) * t;

// Ondergrond: een lichte stalen plaat in een rode bak met opgezette randen (de QR-code staat er licht op af).
const plate = new THREE.Mesh(new THREE.BoxGeometry(N, 0.5, N), new THREE.MeshLambertMaterial({ color: 0xeef2f3 }));
plate.position.y = 0.25; plate.receiveShadow = true; scene.add(plate);
{ // de QR ligt er al, heel licht, als ondergrond; de blokjes van het logo komen er straks op te liggen
  const px = 8, c = document.createElement("canvas"); c.width = c.height = N * px; const g = c.getContext("2d");
  g.fillStyle = "#f4f7f8"; g.fillRect(0, 0, c.width, c.height); g.fillStyle = "#e2e8eb";
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (qr.dark(x, y)) g.fillRect((x + 2) * px, (y + 2) * px, px, px);
  const tex = new THREE.CanvasTexture(c); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  const ghost = new THREE.Mesh(new THREE.PlaneGeometry(N, N), new THREE.MeshLambertMaterial({ map: tex }));
  ghost.rotation.x = -Math.PI / 2; ghost.position.y = 0.505; ghost.receiveShadow = true; scene.add(ghost);
}
const trayMat = new THREE.MeshLambertMaterial({ color: 0xe0262e });
[[0, N / 2 + 0.25, N + 1, 0.5], [0, -N / 2 - 0.25, N + 1, 0.5], [N / 2 + 0.25, 0, 0.5, N], [-N / 2 - 0.25, 0, 0.5, N]].forEach(([x, z, w, d]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1.5, d), trayMat); m.position.set(x, -0.25, z); m.castShadow = m.receiveShadow = true; scene.add(m);
});

// Het logo en de QR-code zijn dezelfde blokjes. Het logo (../wilvo-logo.svg) wordt in de browser naar pixels getekend en tot een
// staand bord geëxtrudeerd (witte achterplaat, de rode balk en het donkere paneel staan er voor, de letters zijn uitgesneden);
// elk blokje heeft een plek in het logo en een plek in de QR. Blokjes die de QR niet nodig heeft, zakken in de plaat.
const VS = 0.25, LW = 132, LH = 62, HC = 47, Z0 = -3.0;       // blokgrootte, logo-pixels breed en hoog, rijen tot onder het paneel, vlak van het bord
const COL = { red: "#e0262e", ink: "#0a1220", badge: "#f1f4f5", steel: "#aeb9bf" }, QRC = "#0b1320";
let items = [], mesh = null, lastP = -1, glintOn = 0;
function build(px) {
  const main = [], extra = [], dst = [];
  for (let py = 0; py < HC; py++) for (let qx = 0; qx < LW; qx++) {
    const i = (py * LW + qx) * 4; if (px[i + 3] < 100) continue;
    const r = px[i], g = px[i + 1], b = px[i + 2];
    const key = r > 170 && g < 110 && b < 110 ? "red" : (r + g + b) / 3 < 120 ? "ink" : "badge";
    const x = (qx - LW / 2 + 0.5) * VS, y = 0.5 + (HC - py - 0.5) * VS;
    for (let l = 0; l < (key === "badge" ? 1 : 2); l++) main.push({ x, y, z: Z0 + l * VS, col: qx, key });
  }
  for (let qx = 0; qx < LW; qx++) for (let zi = 0; zi < 15; zi++) extra.push({ x: (qx - LW / 2 + 0.5) * VS, y: 0.5 + VS / 2, z: Z0 + (zi + 0.5) * VS, key: "steel" });   // omgezette voet
  for (const gx of [-9, 9]) for (let zi = 1; zi <= 14; zi++) {                                                                                                         // steunhoeken
    const h = 3.0 * (1 - zi / 15); for (let yi = 0; yi * VS < h; yi++) for (let dx = 0; dx < 2; dx++) extra.push({ x: gx + (dx - 0.5) * VS, y: 0.5 + (yi + 0.5) * VS, z: Z0 - zi * VS, key: "steel" });
  }
  for (let my = 0; my < S; my++) for (let mx = 0; mx < S; mx++) if (qr.dark(mx, my)) for (let sz = 0; sz < 4; sz++) for (let sx = 0; sx < 4; sx++)
    dst.push({ x: mx - S / 2 + (sx + 0.5) / 4, y: 0.5 + VS / 2, z: my - S / 2 + (sz + 0.5) / 4, col: (mx * 4 + sx) * LW / (S * 4) });
  main.sort((a, b) => a.col - b.col || a.y - b.y); dst.sort((a, b) => a.col - b.col || a.z - b.z);   // kolom voor kolom: onderkant logo -> achterkant QR, bovenkant -> voorkant
  const used = new Uint8Array(main.length), cb = new THREE.Color(QRC);
  const item = (a, b, sink) => {
    const ca = new THREE.Color(COL[a.key]).multiplyScalar(0.94 + rand() * 0.1);
    return { a, b, sink, ca, cb: sink ? ca : cb.clone().multiplyScalar(0.96 + rand() * 0.07), delay: 0.12 * (a.x + 16.5) / 33 + 0.04 * rand(), bump: sink ? 0 : 0.05 * Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z) };
  };
  dst.forEach((b, k) => { const s = Math.min(main.length - 1, Math.floor((k + 0.5) * main.length / dst.length)); used[s] = 1; items.push(item(main[s], b, false)); });
  main.forEach((a, s) => { if (!used[s]) items.push(item(a, { x: a.x, y: 0.4, z: a.z + 5 * rand() }, true)); });
  extra.forEach(a => items.push(item(a, { x: a.x, y: 0.4, z: a.z }, true)));
  mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(VS, VS, VS), new THREE.MeshLambertMaterial(), items.length);
  mesh.castShadow = mesh.receiveShadow = true; mesh.frustumCulled = false; scene.add(mesh);
  lastP = -1;
  if (!reduceMotion) setTimeout(() => { if (!touched) goal = 0; }, 900);     // eerst even de QR, dan vormt het logo zich
}
function morph(p) { // p 0 = logo, 1 = QR
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), sc = new THREE.Vector3(), c = new THREE.Color();
  items.forEach((v, i) => {
    const e = Math.min(1, Math.max(0, (p - v.delay) / 0.8)), t = e < 0.5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2;
    pos.set(lerp(v.a.x, v.b.x, t), lerp(v.a.y, v.b.y, t) + v.bump * Math.sin(Math.PI * t), lerp(v.a.z, v.b.z, t));
    sc.setScalar(Math.max(v.sink ? 1 - ss((e - 0.55) / 0.45) : 1, 1e-4)); m.compose(pos, q, sc); mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, c.copy(v.ca).lerp(v.cb, t));
  });
  mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
}
const cv = document.createElement("canvas"); cv.width = LW; cv.height = LH; const g2 = cv.getContext("2d", { willReadFrequently: true });
const img = new Image();
img.onload = () => { g2.clearRect(0, 0, LW, LH); g2.drawImage(img, 0, 0, LW, LH); build(g2.getImageData(0, 0, LW, LH).data); };
img.onerror = () => { // zonder logobestand: een eenvoudige tekst in dezelfde kleuren
  g2.clearRect(0, 0, LW, LH); g2.fillStyle = "#fff"; g2.fillRect(2, 2, LW - 4, LH - 4); g2.fillStyle = "#e0262e"; g2.fillRect(2, 2, LW - 4, 12);
  g2.fillStyle = "#0a1220"; g2.fillRect(2, 16, LW - 4, 30); g2.fillStyle = "#fff"; g2.font = "900 28px Arial Black, Arial, sans-serif"; g2.textAlign = "center"; g2.fillText("WILVO", LW / 2, 42);
  build(g2.getImageData(0, 0, LW, LH).data);
};
img.src = "../wilvo-logo.svg";

// ---------- Beweging en camera ----------
let u = reduceMotion ? 0 : 1, goal = u, touched = false, clock = 0, last = performance.now();
function view(k) {
  const az = rad(22) * (1 - k), el = rad(33 + 56.9 * k), fit = Math.cos(az) + Math.sin(az);
  const needW = 2 * half * fit * 1.04, needH = 2 * half * fit * Math.sin(el) * 1.02 + 13 * Math.cos(el) + 2;
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1, vh = Math.max(needH, needW * h / w) * (1 - 0.1 * (1 - k)) * (1 - 0.06 * Math.sin(Math.PI * k));
  cam.left = -vh * w / h / 2; cam.right = vh * w / h / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
  const ty = 4.6 * (1 - k);
  cam.position.set(100 * Math.cos(el) * Math.sin(az), ty + 100 * Math.sin(el), 100 * Math.cos(el) * Math.cos(az));
  cam.lookAt(0, ty, 0);
}
const fadeScene = new THREE.Scene(), fadeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);   // bewegingsonscherpte: een deels doorzichtig vlak in de achtergrondkleur laat sporen achter
const fadeMat = new THREE.MeshBasicMaterial({ color: 0xf5f3f1, transparent: true, opacity: 0.42, depthTest: false, depthWrite: false });
fadeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fadeMat));
function resize() { renderer.setSize(stage.clientWidth, stage.clientHeight, false); lastP = -1; }
new ResizeObserver(resize).observe(stage); resize();

function toggle() { touched = true; goal = goal ? 0 : 1; stage.setAttribute("aria-pressed", goal ? "true" : "false"); }
stage.addEventListener("click", toggle);
stage.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

function frame(now) {
  const dt = Math.min(0.3, (now - last) / 1000); last = now;
  const moving = u !== goal;
  if (moving) u = reduceMotion ? goal : Math.min(1, Math.max(0, u + Math.sign(goal - u) * dt / 0.65));
  if (u !== lastP) { if (mesh) morph(u); view(1 - Math.pow(1 - u, 2.2)); lastP = u; }
  if (!reduceMotion) clock += dt;
  const ph = (clock % 5) / 5;            // lichtstreep over het logo
  glint.position.x = -20 + 40 * ph; glint.intensity = u < 0.4 ? 1.6 * Math.sin(Math.PI * ph) * (1 - u / 0.4) : 0;
  renderer.clearDepth();
  if (moving && !reduceMotion) renderer.render(fadeScene, fadeCam); else renderer.clearColor();
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
