      rot = lerp(rot, -12 + Math.max(-14, Math.min(14, (ang + 25) * 0.5)), Math.min(1, dt * 8));            // de uil vliegt op je af: rechtop, met een lichte bocht in de vliegrichting
      const k = 0.26 * Math.min(w, h) / 315 * (0.7 + 0.5 * Math.pow(Math.sin(Math.PI * p), 0.8)), bob = -0.035 * 315 * k * Math.cos(phase - 0.3);
      const px = x * w, py = y * h + 0.02 * h * Math.sin(2 * Math.PI * 1.1 * p) + bob;
      wrap.style.opacity = String(fade);
      wrap.style.transform = "translate(" + px + "px," + py + "px) rotate(" + (rot + 2.5 * Math.sin(phase)) + "deg) scale(" + k + ") translate(-245px,-325px)";   // (125,165) in uilcoördinaten, met viewBox-verschuiving (120,160)
      if (t - lastF > 0.4) { lastF = t; if (p > 0.1 && p < 0.9) spawnFeather(px, py + 18 * k, 0.8 + Math.random() * 0.5); }
    },
    debug(theta, beta) { wrap.style.display = "block"; setPose(theta, beta); }   // alleen voor het beoordelen van de vleugelstanden
  };
  return api;
})();

// De lasergnoester: een kleine heldere vonk met staart die langs de rode rand loopt (bij het logo, niet bij de QR)
const sparkGeo = new THREE.BoxGeometry(1, 1, 1), sparkMat = new THREE.MeshBasicMaterial({ color: 0xffa860, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
const sparks = Array.from({ length: 7 }, () => { const m = new THREE.Mesh(sparkGeo, sparkMat); m.frustumCulled = false; scene.add(m); return m; });
const route = (() => { const i = 4, c = CH, e = PX - 1, P = [[c, i], [e - c, i], [e - i, c], [e - i, e - c], [e - c, e - i], [c, e - i], [i, e - c], [i, c]], seg = []; let len = 0;
  P.forEach((a, k) => { const b = P[(k + 1) % P.length], l = Math.hypot(b[0] - a[0], b[1] - a[1]); seg.push({ a, b, l, s: len }); len += l; }); return { seg, len }; })();
function routePoint(f) { const d = ((f % 1) + 1) % 1 * route.len, sg = route.seg.find(q => d >= q.s && d < q.s + q.l) || route.seg[0], t = (d - sg.s) / sg.l;
  return [lerp(sg.a[0], sg.b[0], t), lerp(sg.a[1], sg.b[1], t)]; }

// ---------- Camera en beweging ----------
let u = 0, goal = 0, clock = 0, last = performance.now(), px = 0, py = 0, tx = 0, ty = 0;
function view(k, aOff, eOff) { // van een zijaanzicht (het logo met zijn reliëf) naar recht van voren (de QR); aOff/eOff: zachte meebeweging met de muis
  const az = (lerp(38, 0, k) + aOff) * Math.PI / 180, el = (lerp(10, 0, k) + eOff) * Math.PI / 180, w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  const needW = (N * Math.cos(az) + 1.2 * Math.sin(Math.abs(az))) * 1.12, needH = (N * Math.cos(el) + 1.2 * Math.sin(Math.abs(el))) * 1.12;
  const vh = Math.max(needH, needW * h / w) / IMG;
  cam.left = -vh * w / h / 2; cam.right = vh * w / h / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
  const cy = N / 2;
  cam.position.set(100 * Math.sin(az) * Math.cos(el), cy + 100 * Math.sin(el), 100 * Math.cos(az) * Math.cos(el)); cam.lookAt(0, cy, 0);
}
function resize() { renderer.setSize(stage.clientWidth, stage.clientHeight, false); lastP = -1; }
new ResizeObserver(resize).observe(stage); resize();
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), logoPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.3), hitP = new THREE.Vector3();
let wasInside = false;
function overLogo(e) {
  const r = stage.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  cam.updateMatrixWorld(); ray.setFromCamera(ndc, cam);
  return !!ray.ray.intersectPlane(logoPlane, hitP) && Math.abs(hitP.x) <= LW * VS / 2 && Math.abs(hitP.y - N / 2) <= LH * VS / 2;
}
function hoverLogo(e) { const inside = overLogo(e); if (inside && !wasInside && !reduceMotion && u === 0 && goal === 0) owl.start(); wasInside = inside; }
stage.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { const r = stage.getBoundingClientRect(); tx = ((e.clientX - r.left) / r.width - 0.5) * 2; ty = ((e.clientY - r.top) / r.height - 0.5) * 2; hoverLogo(e); } });
stage.addEventListener("pointerleave", () => { tx = ty = 0; wasInside = false; });

function toggle() { goal = goal ? 0 : 1; stage.setAttribute("aria-pressed", goal ? "true" : "false"); }
stage.addEventListener("click", toggle);
stage.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

function frame(now) {
  const dt = Math.min(0.3, (now - last) / 1000); last = now;
  if (u !== goal) u = reduceMotion ? goal : Math.min(1, Math.max(0, u + Math.sign(goal - u) * dt / 1.8));
  if (!reduceMotion) clock += dt;
  sun.position.set(lerp(-12, 0, ss(u)), lerp(22, 2, ss(u)), lerp(36, 40, ss(u)));   // in de QR-stand komt het licht recht van voren: geen schaduwranden naast de modules
  const idle = reduceMotion ? 0 : 1 - ss(u / 0.2);
  owl.update(dt, idle, stage.clientWidth, stage.clientHeight);                    // de levende bewegingen trekken weg zodra de morph begint en komen terug in de logo-stand
  if (mesh) { if (u !== lastP) { morph(u, clock, idle); lastP = u; } else if (idle > 0 && u === 0) idleTick(clock); }
  px += (tx - px) * Math.min(1, dt * 3); py += (ty - py) * Math.min(1, dt * 3);
  view(ss(u), idle * (4 * px + 0.9 * Math.sin(clock * 0.5)), idle * (-2 * py + 0.5 * Math.sin(clock * 0.37)));
  const ph = (clock % 6.5) / 6.5;                                      // lichtstreep over het bord
  glint.position.x = -26 + 52 * ph; glint.intensity = 1.5 * Math.sin(Math.PI * ph) * idle;
  const on = idle > 0.01 && !!mesh; sparks.forEach(m => { m.visible = on; });
  if (on) {
    const f0 = (clock / 11) % 1; sparks.forEach((m, k) => { const [gx, gy] = routePoint(f0 - k * 0.006), sz = (k === 0 ? 0.34 : 0.26 * (1 - k / 8)); m.position.set((gx + 0.5 - PX / 2) * VS, N - (gy + 0.5) * VS, 0.62); m.scale.set(sz, sz, sz); });
    sparkMat.opacity = 0.95 * idle; sparkLight.position.copy(sparks[0].position).z += 0.9; sparkLight.intensity = 1.3 * idle;
  } else sparkLight.intensity = 0;
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
