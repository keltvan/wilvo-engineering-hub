<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WILVO | QR</title>
<!-- Het WILVO-logo (../wilvo-logo.svg) als vierkante plaat van blokjes, even groot als de QR-code; tik: het logo morpht in de QR-code en terug.
     Eigen QR-encoder (bytemodus, correctieniveau M, versie 1-10), alleen three.js uit ../../vendor. ?u=<adres> verandert de QR (standaard de Engineering Hub). -->
<style>
:root { --warm: #f5f3f1; --red-ink: #c41f27; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--warm); overflow: hidden; }
#stage { position: absolute; inset: 0; cursor: pointer; outline-offset: -3px; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stage:focus-visible { outline: 3px solid var(--red-ink); }
#flat { display: none; margin: auto; max-width: 90%; max-height: 90%; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="stage" role="button" tabindex="0" aria-pressed="false" aria-label="WILVO-logo: wissel tussen het logo en de QR-code van de Engineering Hub"></div>
<script src="../../vendor/three-0.147.0/three.min.js"></script>
<script>
"use strict";
// ---------- QR-encoder (bytemodus, niveau M, versie 1-10) ----------
function makeQR(text) {
  const data = Array.from(new TextEncoder().encode(text));
  const ECC = [10, 16, 26, 18, 24, 16, 18, 22, 22, 26], BLK = [1, 1, 1, 2, 2, 4, 4, 4, 5, 5];

  let ver = 1;
  while (4 + (ver < 10 ? 8 : 16) + 8 * data.length > ((raw(ver) >> 3) - ECC[ver - 1] * BLK[ver - 1]) * 8) {
    if (++ver > 10) throw new Error("tekst te lang voor de QR (max. ± 213 tekens)");
  }
  const total = raw(ver) >> 3, eccLen = ECC[ver - 1], nb = BLK[ver - 1], cap = total - eccLen * nb;
  const bits = [], put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  put(4, 4); put(data.length, ver < 10 ? 8 : 16); data.forEach(b => put(b, 8));
  put(0, Math.min(4, cap * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  for (let p = 0xEC; bits.length < cap * 8; p ^= 0xEC ^ 0x11) put(p, 8);
  const bytes = []; for (let i = 0; i < bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8).join(""), 2));

  const exp = [], log = []; for (let i = 0, x = 1; i < 255; i++) { exp[i] = x; log[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
  const mul = (a, b) => a && b ? exp[log[a] + log[b]] : 0;
  let gen = [1];
  for (let i = 0; i < eccLen; i++) { const n = new Array(gen.length + 1).fill(0); gen.forEach((c, j) => { n[j] ^= c; n[j + 1] ^= mul(c, exp[i]); }); gen = n; }

    }));
  }

    let r = mask; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const f = ((mask << 10) | r) ^ 0x5412, b = i => ((f >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) set(8, i, b(i));
    set(8, 7, b(6)); set(8, 8, b(7)); set(7, 8, b(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, b(i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, b(i));

    (x, y) => ((x / 3 | 0) + (y / 2 | 0)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,

  const count = (s, p) => { let n = 0, i = -1; while ((i = s.indexOf(p, i + 1)) >= 0) n++; return n; };
  const penalty = () => {
    let p = 0, dark = 0;
    const lines = [];
    for (let y = 0; y < size; y++) { lines.push(mod[y].map(Number).join("")); }
    for (let x = 0; x < size; x++) { lines.push(mod.map(r => Number(r[x])).join("")); }

      for (const m of s.match(/0{5,}|1{5,}/g) || []) p += 3 + m.length - 5;

    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (mod[y][x]) dark++;

// ---------- Instellingen ----------
const params = new URLSearchParams(location.search);
const HUB = "https://keltvan.github.io/wilvo-engineering-hub/";
const target = (params.get("u") || HUB).slice(0, 200);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const qr = makeQR(target);

if (params.has("selftest")) {
  const s = qr.size, bad = [];
  if (s !== qr.ver * 4 + 17) bad.push("grootte");
  for (const [x, y] of [[3, 3], [s - 4, 3], [3, s - 4]]) if (!qr.dark(x, y) || qr.dark(x + 2, y) || !qr.dark(x + 3, y)) bad.push("zoekblokje");
  for (let i = 8; i < s - 8; i++) if (qr.dark(i, 6) !== (i % 2 === 0) || qr.dark(6, i) !== (i % 2 === 0)) bad.push("timing");
  const bit = (x, y) => qr.dark(x, y) ? 1 : 0;
  let f1 = 0, f2 = 0;
  for (let i = 0; i < 15; i++) {
    f1 |= bit(...(i < 6 ? [8, i] : i < 8 ? [8, i + 1] : i === 8 ? [7, 8] : [14 - i, 8])) << i;
    f2 |= bit(...(i < 8 ? [s - 1 - i, 8] : [8, s - 15 + i])) << i;
  }
  let r = f1 ^ 0x5412; for (let i = 14; i >= 10; i--) if ((r >>> i) & 1) r ^= 0x537 << (i - 10);
  if (f1 !== f2 || r !== 0) bad.push("formaatbits");
  document.documentElement.dataset.selftest = bad.length ? "fail " + bad.join(",") : "pass qr v" + qr.ver + " masker " + qr.mask;
}

// ---------- Scene ----------
const stage = document.getElementById("stage");
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { renderer = null; }
if (!renderer) { // zonder WebGL: platte QR, zodat de tegel nooit leeg blijft
  const c = document.createElement("canvas"), n = qr.size + 8, g = c.getContext("2d");
  c.width = c.height = n; c.id = "flat"; c.style.display = "block";
  g.fillStyle = "#fff"; g.fillRect(0, 0, n, n); g.fillStyle = "#252b2e";
  for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) if (qr.dark(x, y)) g.fillRect(x + 4, y + 4, 1, 1);
  stage.appendChild(c);
  throw new Error("WebGL niet beschikbaar: platte QR getoond");
}
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setClearColor(0xf5f3f1);
renderer.shadowMap.enabled = true;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(-18, 40, 24);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 120 });
scene.add(sun);
const glint = new THREE.PointLight(0xfff4e0, 0, 30, 1.3); glint.position.set(-20, 7, 4); scene.add(glint);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);

const S = qr.size, N = S + 4, half = N / 2, SQ = S * 4, VS = 0.25;      // SQ: blokjes per zijde; een QR-module is 4 x 4 blokjes
const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const lerp = (a, b, t) => a + (b - a) * t, clamp01 = x => Math.min(1, Math.max(0, x));

// Ondergrond: een lichte stalen plaat in een rode bak met opgezette randen.
const plate = new THREE.Mesh(new THREE.BoxGeometry(N, 0.5, N), new THREE.MeshLambertMaterial({ color: 0xeef2f3 }));
plate.position.y = 0.25; plate.receiveShadow = true; scene.add(plate);
const trayMat = new THREE.MeshLambertMaterial({ color: 0xe0262e });
[[0, N / 2 + 0.25, N + 1, 0.5], [0, -N / 2 - 0.25, N + 1, 0.5], [N / 2 + 0.25, 0, 0.5, N], [-N / 2 - 0.25, 0, 0.5, N]].forEach(([x, z, w, d]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1.5, d), trayMat); m.position.set(x, -0.25, z); m.castShadow = m.receiveShadow = true; scene.add(m);
});

// Logo en QR hebben dezelfde afmetingen en dezelfde blokjes. Het logo (../wilvo-logo.svg) wordt in de browser naar pixels getekend en
// tot een vierkante plaat gemaakt: rode balk, een donker paneel (verlengd, zodat het vierkant wordt) en de letters als uitsnijding.
// Blokjes die in logo én QR op dezelfde plek zitten blijven staan; de overige stromen naar de dichtstbijzijnde QR-plek (of krimpen weg / groeien aan).
const COL = { red: "#e0262e", ink: "#0a1220" }, QRC = "#0b1320";
let items = [], mesh = null, lastP = -1;
function assign(L, Q, axis, out) { // verdeel logo-blokjes L over QR-plekken Q: halveer Q, verdeel L naar rato, wissel van as
  if (!Q.length) { L.forEach(a => out.sink.push(a)); return; }

    const [one, many] = Q.length === 1 ? [Q[0], L] : [L[0], Q];
    let best = 0, bd = Infinity; many.forEach((c, i) => { const d = Math.hypot(c.x - one.x, c.z - one.z); if (d < bd) { bd = d; best = i; } });

function build(px, W, H) { // px: RGBA van het logo, getekend op W x H (W = SQ)
  const key = (x, y) => { const i = (y * W + x) * 4; if (px[i + 3] < 100) return null; const r = px[i], g = px[i + 1], b = px[i + 2]; return r > 170 && g < 110 && b < 110 ? "red" : (r + g + b) / 3 < 120 ? "ink" : "badge"; };
  let barT = -1, barB = -1, panT = -1, panB = -1, lt = -1, lb = -1;
  for (let y = 0; y < H; y++) { // hele rijen tellen: de balk is bijna rood over de volle breedte, het paneel vooral donker; de kleine slogan eronder haalt dat niet
    let red = 0, ink = 0; for (let x = 0; x < W; x++) { const k = key(x, y); if (k === "red") red++; else if (k === "ink") ink++; }
    if (red >= W * 0.5) { if (barT < 0) barT = y; barB = y; } else if (ink >= W * (panT < 0 ? 0.3 : 0.15)) { if (panT < 0) panT = y; panB = y; } else if (panT >= 0) break;   // het paneel is één aaneengesloten blok; de witte rij eronder beëindigt het
  }
  for (let y = Math.max(panT, 0); y <= panB; y++) for (let x = Math.round(W * 0.1); x < Math.round(W * 0.9); x++) if (key(x, y) === "badge") { if (lt < 0) lt = y; lb = y; break; }
  if (barT < 0 || panT < 0 || lt < 0) { barT = 0; barB = Math.round(H * 0.2); panT = Math.round(H * 0.25); panB = Math.round(H * 0.75); lt = Math.round(H * 0.35); lb = Math.round(H * 0.65); }
  const bh = barB - barT + 1, y0 = bh + Math.max(1, Math.round(W / 60)), Hn = SQ - y0, Lh = lb - lt + 1, lTop = y0 + ((Hn - Lh) >> 1);
  const srcRow = r => r < bh ? barT + r : r < y0 ? -1 : r < lTop ? panT + 2 : r < lTop + Lh ? lt + (r - lTop) : panT + 2;   // letters houden hun verhouding; alleen het donkere paneel wordt hoger
  const cell = (gx, gz, k) => ({ gx, gz, x: (gx - SQ / 2 + 0.5) * VS, z: (gz - SQ / 2 + 0.5) * VS, key: k });
  const logo = new Map(), qrc = new Map();
  for (let r = 0; r < SQ; r++) { const sr = srcRow(r); if (sr < 0) continue; for (let gx = 0; gx < SQ; gx++) { const k = key(Math.min(W - 1, gx), Math.min(H - 1, sr)); if (k === "red" || k === "ink") logo.set(r * SQ + gx, cell(gx, r, k)); } }
  for (let my = 0; my < S; my++) for (let mx = 0; mx < S; mx++) if (qr.dark(mx, my)) for (let sz = 0; sz < 4; sz++) for (let sx = 0; sx < 4; sx++) { const gx = mx * 4 + sx, gz = my * 4 + sz; qrc.set(gz * SQ + gx, cell(gx, gz, "ink")); }

  out.pair.forEach(([a, b]) => item(a, b, 1)); out.sink.forEach(a => item(a, a, 2)); out.born.forEach(b => item(b, b, 3));

const cv = document.createElement("canvas"), LH = Math.round(SQ * 62 / 132); cv.width = SQ; cv.height = LH; const g2 = cv.getContext("2d", { willReadFrequently: true });
const img = new Image();
img.onload = () => { g2.clearRect(0, 0, SQ, LH); g2.drawImage(img, 0, 0, SQ, LH); build(g2.getImageData(0, 0, SQ, LH).data, SQ, LH); };
img.onerror = () => { // zonder logobestand: een eenvoudig bord in dezelfde kleuren
  g2.clearRect(0, 0, SQ, LH); g2.fillStyle = "#fff"; g2.fillRect(2, 2, SQ - 4, LH - 4); g2.fillStyle = "#e0262e"; g2.fillRect(2, 2, SQ - 4, Math.round(LH * 0.2));
  g2.fillStyle = "#0a1220"; g2.fillRect(2, Math.round(LH * 0.25), SQ - 4, Math.round(LH * 0.5)); g2.fillStyle = "#fff"; g2.font = "900 " + Math.round(LH * 0.4) + "px Arial Black, Arial, sans-serif"; g2.textAlign = "center"; g2.fillText("WILVO", SQ / 2, Math.round(LH * 0.64));
  build(g2.getImageData(0, 0, SQ, LH).data, SQ, LH);
};
img.src = "../wilvo-logo.svg";

// ---------- Camera (vast) en beweging ----------
let u = 0, goal = 0, clock = 0, last = performance.now();
function view() {
  const el = 75 * Math.PI / 180, w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  const vh = Math.max(2 * half * Math.sin(el) * 1.1 + 3 * Math.cos(el), 2 * half * 1.1 * h / w);
  cam.left = -vh * w / h / 2; cam.right = vh * w / h / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
  cam.position.set(0, 100 * Math.sin(el), 100 * Math.cos(el)); cam.lookAt(0, 0, 0);
}
function resize() { renderer.setSize(stage.clientWidth, stage.clientHeight, false); view(); }
new ResizeObserver(resize).observe(stage); resize();

function toggle() { goal = goal ? 0 : 1; stage.setAttribute("aria-pressed", goal ? "true" : "false"); }
stage.addEventListener("click", toggle);
stage.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

function frame(now) {
  const dt = Math.min(0.3, (now - last) / 1000); last = now;
  if (u !== goal) u = reduceMotion ? goal : Math.min(1, Math.max(0, u + Math.sign(goal - u) * dt / 1.8));
  if (u !== lastP && mesh) { morph(u); lastP = u; }
  if (!reduceMotion) clock += dt;
  const ph = (clock % 5) / 5;            // lichtstreep over het logo
  glint.position.x = -22 + 44 * ph; glint.intensity = u < 0.3 ? 1.4 * Math.sin(Math.PI * ph) * (1 - u / 0.3) : 0;
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
