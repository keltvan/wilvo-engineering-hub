<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WILVO | QR</title>
<!-- Het WILVO-logo (../wilvo-logo.svg, ongewijzigd) in een frame op een staand vierkant bord, even groot als de QR-code; tik: het logo morpht in de QR-code en terug,
     terwijl de camera van zijaanzicht naar recht van voren draait. Eigen QR-encoder (bytemodus, niveau M, versie 1-10), alleen three.js uit ../../vendor.
     ?u=<adres> verandert de QR (standaard de Engineering Hub). -->
<style>
:root { --warm: #f5f3f1; --red-ink: #c41f27; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--warm); overflow: hidden; }
#stage { position: absolute; inset: 0; cursor: pointer; outline-offset: -3px; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stage:focus-visible { outline: 3px solid var(--red-ink); }
#flat { display: none; margin: auto; max-width: 90%; max-height: 90%; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="stage" role="button" tabindex="0" aria-pressed="false" aria-label="WILVO-logo: wissel tussen het logo en de QR-code van de Engineering Hub"></div>
<script src="../../vendor/three-0.147.0/three.min.js"></script>
<script>
"use strict";
// ---------- QR-encoder (bytemodus, niveau M, versie 1-10) ----------
function makeQR(text) {
  const data = Array.from(new TextEncoder().encode(text));
  const ECC = [10, 16, 26, 18, 24, 16, 18, 22, 22, 26], BLK = [1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const raw = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const a = (v / 7 | 0) + 2; r -= (25 * a - 10) * a - 55; if (v >= 7) r -= 36; } return r; };
  let ver = 1;
  while (4 + (ver < 10 ? 8 : 16) + 8 * data.length > ((raw(ver) >> 3) - ECC[ver - 1] * BLK[ver - 1]) * 8) {
    if (++ver > 10) throw new Error("tekst te lang voor de QR (max. ± 213 tekens)");
  }
  const total = raw(ver) >> 3, eccLen = ECC[ver - 1], nb = BLK[ver - 1], cap = total - eccLen * nb;
  const bits = [], put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  put(4, 4); put(data.length, ver < 10 ? 8 : 16); data.forEach(b => put(b, 8));
  put(0, Math.min(4, cap * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  for (let p = 0xEC; bits.length < cap * 8; p ^= 0xEC ^ 0x11) put(p, 8);
  const bytes = []; for (let i = 0; i < bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8).join(""), 2));

  const exp = [], log = []; for (let i = 0, x = 1; i < 255; i++) { exp[i] = x; log[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
  const mul = (a, b) => a && b ? exp[log[a] + log[b]] : 0;
  let gen = [1];
  for (let i = 0; i < eccLen; i++) { const n = new Array(gen.length + 1).fill(0); gen.forEach((c, j) => { n[j] ^= c; n[j + 1] ^= mul(c, exp[i]); }); gen = n; }
  const rem = d => { const r = new Array(eccLen).fill(0); for (const b of d) { const f = b ^ r.shift(); r.push(0); for (let i = 0; i < eccLen; i++) r[i] ^= mul(gen[i + 1], f); } return r; };
  const short = nb - total % nb, shortLen = (total / nb | 0) - eccLen, blocks = [];
  for (let i = 0, k = 0; i < nb; i++) { const d = bytes.slice(k, k += shortLen + (i < short ? 0 : 1)); blocks.push({ d, e: rem(d) }); }
  const code = [];
  for (let i = 0; i <= shortLen; i++) blocks.forEach(b => { if (i < b.d.length) code.push(b.d[i]); });
  for (let i = 0; i < eccLen; i++) blocks.forEach(b => code.push(b.e[i]));

  const size = ver * 4 + 17, mod = [], fn = [];
  for (let y = 0; y < size; y++) { mod.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
  const set = (x, y, d) => { if (x >= 0 && y >= 0 && x < size && y < size) { mod[y][x] = d; fn[y][x] = true; } };
  for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]])
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)); set(cx + dx, cy + dy, d !== 2 && d !== 4); }
  if (ver > 1) {
    const n = (ver / 7 | 0) + 2, step = ((ver * 8 + n * 3 + 5) / (n * 4 - 4) | 0) * 2, pos = [6];
    for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
    pos.forEach((cy, i) => pos.forEach((cx, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
  }
  const drawFormat = mask => {
    let r = mask; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const f = ((mask << 10) | r) ^ 0x5412, b = i => ((f >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) set(8, i, b(i));
    set(8, 7, b(6)); set(8, 8, b(7)); set(7, 8, b(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, b(i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, b(i));
    for (let i = 8; i < 15; i++) set(8, size - 15 + i, b(i));
    set(8, size - 8, true);
  };
  drawFormat(0);
  if (ver >= 7) {
    let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
    const v = (ver << 12) | r;
    for (let i = 0; i < 18; i++) { const b = ((v >>> i) & 1) !== 0, a = size - 11 + i % 3, c = i / 3 | 0; set(a, c, b); set(c, a, b); }
  }
  let k = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
      const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - vert : vert;
      if (!fn[y][x] && k < code.length * 8) { mod[y][x] = ((code[k >> 3] >>> (7 - (k & 7))) & 1) !== 0; k++; }
    }
  }
  const cond = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
    (x, y) => ((x / 3 | 0) + (y / 2 | 0)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
    (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
  const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && cond[m](x, y)) mod[y][x] = !mod[y][x]; };
  const count = (s, p) => { let n = 0, i = -1; while ((i = s.indexOf(p, i + 1)) >= 0) n++; return n; };
  const penalty = () => {
    let p = 0, dark = 0;
    const lines = [];
    for (let y = 0; y < size; y++) { lines.push(mod[y].map(Number).join("")); }
    for (let x = 0; x < size; x++) { lines.push(mod.map(r => Number(r[x])).join("")); }
    for (const s of lines) {
      for (const m of s.match(/0{5,}|1{5,}/g) || []) p += 3 + m.length - 5;
      p += 40 * (count(s, "10111010000") + count(s, "00001011101"));
    }
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (mod[y][x]) dark++;
      if (x && y && mod[y][x] === mod[y][x - 1] && mod[y][x] === mod[y - 1][x] && mod[y][x] === mod[y - 1][x - 1]) p += 3;
    }
    return p + (Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1) * 10;
  };
  let best = 0, bestP = Infinity;
  for (let m = 0; m < 8; m++) { applyMask(m); drawFormat(m); const p = penalty(); if (p < bestP) { best = m; bestP = p; } applyMask(m); }
  applyMask(best); drawFormat(best);
  return { size, ver, mask: best, dark: (x, y) => mod[y][x] };
}

// ---------- Instellingen ----------
const params = new URLSearchParams(location.search);
const HUB = "https://keltvan.github.io/wilvo-engineering-hub/";
const target = (params.get("u") || HUB).slice(0, 200);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const qr = makeQR(target);

if (params.has("selftest")) {
  const s = qr.size, bad = [];
  if (s !== qr.ver * 4 + 17) bad.push("grootte");
  for (const [x, y] of [[3, 3], [s - 4, 3], [3, s - 4]]) if (!qr.dark(x, y) || qr.dark(x + 2, y) || !qr.dark(x + 3, y)) bad.push("zoekblokje");
  for (let i = 8; i < s - 8; i++) if (qr.dark(i, 6) !== (i % 2 === 0) || qr.dark(6, i) !== (i % 2 === 0)) bad.push("timing");
  const bit = (x, y) => qr.dark(x, y) ? 1 : 0;
  let f1 = 0, f2 = 0;
  for (let i = 0; i < 15; i++) {
    f1 |= bit(...(i < 6 ? [8, i] : i < 8 ? [8, i + 1] : i === 8 ? [7, 8] : [14 - i, 8])) << i;
    f2 |= bit(...(i < 8 ? [s - 1 - i, 8] : [8, s - 15 + i])) << i;
  }
  let r = f1 ^ 0x5412; for (let i = 14; i >= 10; i--) if ((r >>> i) & 1) r ^= 0x537 << (i - 10);
  if (f1 !== f2 || r !== 0) bad.push("formaatbits");
  document.documentElement.dataset.selftest = bad.length ? "fail " + bad.join(",") : "pass qr v" + qr.ver + " masker " + qr.mask;
}

// ---------- Scene ----------
const stage = document.getElementById("stage");
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { renderer = null; }
if (!renderer) { // zonder WebGL: platte QR, zodat de tegel nooit leeg blijft
  const c = document.createElement("canvas"), n = qr.size + 8, g = c.getContext("2d");
  c.width = c.height = n; c.id = "flat"; c.style.display = "block";
  g.fillStyle = "#fff"; g.fillRect(0, 0, n, n); g.fillStyle = "#252b2e";
  for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) if (qr.dark(x, y)) g.fillRect(x + 4, y + 4, 1, 1);
  stage.appendChild(c);
  throw new Error("WebGL niet beschikbaar: platte QR getoond");
}
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setClearColor(0xf5f3f1);
renderer.shadowMap.enabled = true;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(-12, 22, 36);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 140 });
scene.add(sun);
const glint = new THREE.PointLight(0xfff4e0, 0, 40, 1.3); glint.position.set(-24, 20, 8); scene.add(glint);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);

const S = qr.size, N = S + 4, VS = 1 / 6, PX = N * 6, QM = 12;       // een QR-module is 6 x 6 blokjes; QM: stille rand rond de QR in blokjes
const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const lerp = (a, b, t) => a + (b - a) * t, clamp01 = x => Math.min(1, Math.max(0, x)), ease3 = e => e < 0.5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2;

// Het bord: een staande lichte plaat, vierkant als de QR-code met zijn stille rand. De QR zelf is alleen de QR; het logo krijgt er een frame bij.
const board = new THREE.Mesh(new THREE.BoxGeometry(N, N, 0.8), new THREE.MeshLambertMaterial({ color: 0xeef2f3 }));
board.position.set(0, N / 2, -0.4); board.castShadow = board.receiveShadow = true; scene.add(board);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);

// Logo en QR zijn dezelfde blokjes. Logo-stand: het echte WILVO-logo (../wilvo-logo.svg, ongewijzigd, met slogan) in een frame met
// rode rand, klinknagels en geponste gaten. Blokjes die in logo én QR op dezelfde plek zitten blijven staan; de overige stromen naar
// de dichtstbijzijnde QR-plek (of krimpen weg / groeien aan).
const COL = { red: "#e0262e", ink: "#0a1220", steel: "#aeb9bf" }, QRC = "#0b1320";
let items = [], mesh = null, lastP = -1;
function assign(L, Q, axis, out) { // verdeel logo-blokjes L over QR-plekken Q: halveer Q, verdeel L naar rato, wissel van as
  if (!Q.length) { L.forEach(a => out.sink.push(a)); return; }
  if (!L.length) { Q.forEach(b => out.born.push(b)); return; }
  if (Q.length === 1 || L.length === 1) {
    const [one, many] = Q.length === 1 ? [Q[0], L] : [L[0], Q];
    let best = 0, bd = Infinity; many.forEach((c, i) => { const d = Math.hypot(c.x - one.x, c.y - one.y); if (d < bd) { bd = d; best = i; } });
    many.forEach((c, i) => { if (Q.length === 1) { if (i === best) out.pair.push([c, one]); else out.sink.push(c); } else { if (i === best) out.pair.push([one, c]); else out.born.push(c); } });
    return;
  }
  const k = axis ? "y" : "x", cmp = (a, b) => a[k] - b[k] || a.x - b.x || a.y - b.y;
  L = L.slice().sort(cmp); Q = Q.slice().sort(cmp);
  const m = Q.length >> 1, l = Math.round(L.length * m / Q.length);
  assign(L.slice(0, l), Q.slice(0, m), 1 - axis, out); assign(L.slice(l), Q.slice(m), 1 - axis, out);
}
function build(px, W, H) { // px: RGBA van het logo, getekend op W x H
  const cell = (gx, gy, k) => ({ gx, gy, x: (gx + 0.5 - PX / 2) * VS, y: N - (gy + 0.5) * VS, key: k });
  const logo = new Map(), qrc = new Map();
  const put = (m, gx, gy, k) => { if (gx >= 0 && gy >= 0 && gx < PX && gy < PX) m.set(gy * PX + gx, cell(gx, gy, k)); };
  const RW = 9;                                                                                   // rode rand
  for (let gy = 0; gy < PX; gy++) for (let gx = 0; gx < PX; gx++) if (Math.min(gx, gy, PX - 1 - gx, PX - 1 - gy) < RW) put(logo, gx, gy, "red");
  const rivet = (cx, cy) => { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) put(logo, cx + dx, cy + dy, "steel"); };
  for (let c = 14; c < PX - 10; c += 28) { rivet(c, 4); rivet(c, PX - 5); rivet(4, c); rivet(PX - 5, c); }
  rivet(4, 4); rivet(PX - 5, 4); rivet(4, PX - 5); rivet(PX - 5, PX - 5);
  const holes = cy0 => { for (let r = 0; r < 3; r++) { const cy = cy0 + r * 14, off = r % 2 ? 7 : 0; for (let cx = 28 + off; cx < PX - 26; cx += 14) for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) if (dx * dx + dy * dy <= 13.7) put(logo, cx + dx, cy + dy, "ink"); } };
  holes(24); holes(PX - 53);                                                                      // geponste gaten boven en onder het logo
  const ox = (PX - W) >> 1, oy = (PX - H) >> 1;                                                   // het logo zelf, onaangeroerd, in het midden
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4; if (px[i + 3] < 100) continue; const r = px[i], g = px[i + 1], b = px[i + 2];
    const k = r > 170 && g < 110 && b < 110 ? "red" : (r + g + b) / 3 < 170 ? "ink" : null; if (k) put(logo, ox + x, oy + y, k);
  }
  for (let my = 0; my < S; my++) for (let mx = 0; mx < S; mx++) if (qr.dark(mx, my)) for (let sy = 0; sy < 6; sy++) for (let sx = 0; sx < 6; sx++) put(qrc, QM + mx * 6 + sx, QM + my * 6 + sy, "ink");
  const out = { pair: [], sink: [], born: [] }, Lr = [], Qr = [];
  const cb0 = new THREE.Color(QRC), jit = () => 0.94 + rand() * 0.1;
  const item = (a, b, mode) => {
    const ca = new THREE.Color(mode === 3 ? QRC : COL[a.key]).multiplyScalar(jit());
    const dist = Math.hypot(b.x - a.x, b.y - a.y), rd = Math.hypot((a.x + b.x) / 2, (a.y + b.y) / 2 - N / 2) / (N * 0.7);
    items.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y, mode, ca, cb: mode === 2 ? ca : cb0.clone().multiplyScalar(0.96 + rand() * 0.07), delay: 0.25 * rd + 0.05 * rand(), lift: mode === 1 ? Math.min(1.2, 0.25 + 0.1 * dist) : 0 });
  };
  logo.forEach((a, k) => { const b = qrc.get(k); if (b) item(a, b, 0); else Lr.push(a); });
  qrc.forEach((b, k) => { if (!logo.has(k)) Qr.push(b); });
  assign(Lr, Qr, 0, out);
  out.pair.forEach(([a, b]) => item(a, b, 1)); out.sink.forEach(a => item(a, a, 2)); out.born.forEach(b => item(b, b, 3));
  mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(VS, VS, VS), new THREE.MeshLambertMaterial(), items.length * 2);
  mesh.castShadow = mesh.receiveShadow = true; mesh.frustumCulled = false; scene.add(mesh);
  lastP = -1;
}
function morph(p) { // p 0 = logo, 1 = QR
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), sc = new THREE.Vector3(), c = new THREE.Color();
  items.forEach((v, i) => {
    const t = ease3(clamp01((p - v.delay) / 0.7)), x = lerp(v.ax, v.bx, t), y = lerp(v.ay, v.by, t), lift = v.lift * Math.sin(Math.PI * t);
    sc.setScalar(Math.max(v.mode === 2 ? 1 - t : v.mode === 3 ? t : 1, 1e-4)); c.copy(v.ca).lerp(v.cb, t);
    for (let l = 0; l < 2; l++) { pos.set(x, y, (l + 0.5) * VS + lift); m.compose(pos, q, sc); mesh.setMatrixAt(2 * i + l, m); mesh.setColorAt(2 * i + l, c); }
  });
  mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
}
const LW = 168, LH = Math.round(LW * 136.565 / 291.164);        // het logo op ware verhouding (zijn eigen kijkdoos), 28 eenheden breed
const cv = document.createElement("canvas"); cv.width = LW; cv.height = LH; const g2 = cv.getContext("2d", { willReadFrequently: true });
const img = new Image();
img.onload = () => { g2.clearRect(0, 0, LW, LH); g2.drawImage(img, 0, 0, LW, LH); build(g2.getImageData(0, 0, LW, LH).data, LW, LH); };
img.onerror = () => { // zonder logobestand: een eenvoudig bord in dezelfde kleuren
  g2.clearRect(0, 0, LW, LH); g2.fillStyle = "#e0262e"; g2.fillRect(2, 2, LW - 4, Math.round(LH * 0.2)); g2.fillStyle = "#0a1220"; g2.fillRect(2, Math.round(LH * 0.25), LW - 4, Math.round(LH * 0.55));
  g2.fillStyle = "#fff"; g2.font = "900 " + Math.round(LH * 0.36) + "px Arial Black, Arial, sans-serif"; g2.textAlign = "center"; g2.fillText("WILVO", LW / 2, Math.round(LH * 0.64));
  build(g2.getImageData(0, 0, LW, LH).data, LW, LH);
};
img.src = "../wilvo-logo.svg";

// ---------- Camera en beweging ----------
let u = 0, goal = 0, clock = 0, last = performance.now();
function view(k) { // van een zijaanzicht (het logo met zijn reliëf) naar recht van voren (de QR)
  const az = lerp(38, 0, k) * Math.PI / 180, el = lerp(10, 0, k) * Math.PI / 180, w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  const needW = (N * Math.cos(az) + 1.2 * Math.sin(az)) * 1.12, needH = (N * Math.cos(el) + 1.2 * Math.sin(el)) * 1.12;
  const vh = Math.max(needH, needW * h / w);
  cam.left = -vh * w / h / 2; cam.right = vh * w / h / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
  const ty = N / 2;
  cam.position.set(100 * Math.sin(az) * Math.cos(el), ty + 100 * Math.sin(el), 100 * Math.cos(az) * Math.cos(el)); cam.lookAt(0, ty, 0);
}
function resize() { renderer.setSize(stage.clientWidth, stage.clientHeight, false); lastP = -1; }
new ResizeObserver(resize).observe(stage); resize();

function toggle() { goal = goal ? 0 : 1; stage.setAttribute("aria-pressed", goal ? "true" : "false"); }
stage.addEventListener("click", toggle);
stage.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

function frame(now) {
  const dt = Math.min(0.3, (now - last) / 1000); last = now;
  if (u !== goal) u = reduceMotion ? goal : Math.min(1, Math.max(0, u + Math.sign(goal - u) * dt / 1.8));
  if (u !== lastP) { if (mesh) morph(u); view(u * u * (3 - 2 * u)); lastP = u; }
  if (!reduceMotion) clock += dt;
  const ph = (clock % 5) / 5;            // lichtstreep over het logo
  glint.position.x = -26 + 52 * ph; glint.intensity = u < 0.3 ? 1.5 * Math.sin(Math.PI * ph) * (1 - u / 0.3) : 0;
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
